name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify static studio
        run: |
          set -euo pipefail
          test -f docs/index.html
          test -f docs/app.js
          test -f docs/styles.css
          test -f docs/lib/render.js
          test -f docs/lib/audio.js
          test -f docs/lib/narration.js
          test -f docs/lib/watercolor.js
          test -f docs/lib/webm.js
          test -f docs/lib/capabilities.js
          test -f docs/favicon.svg

          if grep -RInE 'https?://(cdn\.|unpkg\.|jsdelivr\.|mcp\.videogen\.io|api\.videogen\.io)' \
              --exclude-dir=fonts docs; then
            echo "External runtime URL found in docs/" >&2
            exit 1
          fi
          echo "docs/ studio OK"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install ffmpeg + espeak-ng
        run: sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ffmpeg espeak-ng fonts-dejavu-core

      - name: Unit tests (pure helpers + WebM muxer)
        run: npm test

      - name: Local pipeline smoke (doctor + fast render)
        run: |
          set -euo pipefail
          node local/cli.mjs doctor
          node local/cli.mjs script-to-video \
            --script "Continuous integration render. Two sentences, timed captions." \
            --quality fast --out /tmp/ci-render --quiet
          ffprobe -v error -show_entries stream=codec_name:format=duration -of compact /tmp/ci-render/export.mp4
          test -f /tmp/ci-render/work/captions.srt

  deploy:
    needs: verify
    # github-pages environment allows only main (custom branch policy).
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload docs/
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
